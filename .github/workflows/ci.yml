name: ci
on:
  push:
  pull_request:
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Shell syntax
        run: |
          for f in install.sh uninstall.sh tests/routing/setup.sh tests/routing/setup_codex.sh; do bash -n "$f"; done
      - name: Gate unit test
        run: node tests/gate/test.mjs
      - name: Install plan
        run: bash install.sh --list
      - name: Install and uninstall in a clean home
        run: |
          export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"
          bash install.sh --agents claude-code
          test -f "$HOME/.claude/CLAUDE.md"
          grep -q '"name-only"' "$HOME/.claude/settings.json"
          bash uninstall.sh --agents claude-code
          ! grep -q "agent-basic-skillset:start" "$HOME/.claude/CLAUDE.md"
          ! grep -q '"name-only"' "$HOME/.claude/settings.json"
      - name: Codex install and uninstall in a clean home
        run: |
          export HOME="$RUNNER_TEMP/home-codex" && mkdir -p "$HOME/.codex"
          printf 'model_reasoning_effort = "high"\n' > "$HOME/.codex/config.toml"
          bash install.sh --agents codex
          grep -q "enabled = false" "$HOME/.codex/config.toml"
          python3 -c 'import tomllib,os; tomllib.load(open(os.path.expanduser("~/.codex/config.toml"),"rb"))'
          bash uninstall.sh --agents codex
          ! grep -q "agent-basic-skillset" "$HOME/.codex/config.toml"
          grep -q "model_reasoning_effort" "$HOME/.codex/config.toml"
      - name: Update checker syntax
        run: python3 -m py_compile scripts/check-updates.py
